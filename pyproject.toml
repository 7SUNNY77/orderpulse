[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderpulse"
version = "1.0.0"
description = "OrderPulse: delivery-delay analytics and approval-time risk queue on the Olist dataset"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
# Versions verified in .venv (Python 3.11.15, Windows 11) on 2026-10-12.
dependencies = [
    "duckdb>=1.5,<1.6",
    "pandas>=3.0,<3.1",
    "numpy>=2.4,<2.5",
    "pyarrow>=25,<26",
    "catboost>=1.2.10,<1.3",
    "scikit-learn>=1.9,<1.10",
    "plotly>=7.1,<7.2",
    "streamlit>=1.65,<1.66",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10"]

[project.scripts]
orderpulse = "orderpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: full synthetic pipeline (ingest -> train -> predict) and Streamlit AppTest pages; slower",
]
